services:
  backend:
    image: devflow-harness-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    image: devflow-harness-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile.server
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8082:80"
