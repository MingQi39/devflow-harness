<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>DevFlow Harness</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f4f6f8;
        color: #1a1a1a;
        padding: 24px;
      }
      main {
        max-width: 520px;
        background: #fff;
        border-radius: 12px;
        padding: 28px 32px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.55;
        color: #444;
      }
      code {
        font-size: 0.9em;
        background: #f0f2f5;
        padding: 2px 6px;
        border-radius: 4px;
      }
      pre {
        margin: 16px 0;
        padding: 12px 14px;
        background: #1e1e1e;
        color: #e8e8e8;
        border-radius: 8px;
        font-size: 13px;
        overflow-x: auto;
      }
      button {
        margin-top: 8px;
        padding: 10px 18px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>前端开发服务未启动</h1>
      <p>
        桌面端需要加载 <code id="app-url"></code>，但连接被拒绝（Vite 未在运行）。
      </p>
      <p>请在新终端启动前端：</p>
      <pre>cd frontend && pnpm dev</pre>
      <p>后端（8000）也需单独运行。启动完成后可点击下方按钮或等待自动重试。</p>
      <button type="button" id="retry">重新连接</button>
      <p id="status">正在等待前端…</p>
    </main>
    <script>
      const params = new URLSearchParams(location.search)
      const appUrl = params.get('url') || 'http://127.0.0.1:5173/'
      document.getElementById('app-url').textContent = appUrl
      const statusEl = document.getElementById('status')

      async function tryLoad() {
        statusEl.textContent = '正在检测 ' + appUrl + ' …'
        try {
          const res = await fetch(appUrl, { mode: 'no-cors' })
          void res
          statusEl.textContent = '已检测到服务，正在跳转…'
          location.replace(appUrl)
        } catch {
          statusEl.textContent = '仍未连接，' + new Date().toLocaleTimeString() + ' 将再次重试'
        }
      }

      document.getElementById('retry').addEventListener('click', tryLoad)
      tryLoad()
      setInterval(tryLoad, 3000)
    </script>
  </body>
</html>
